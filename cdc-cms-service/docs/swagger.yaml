  internal_api.WorkerScheduleCreateRequest:
    properties:
      interval_minutes:
        type: integer
      is_enabled:
        type: boolean
      notes:
        type: string
      operation:
        type: string
      shadow_schema:
        type: string
      shadow_table:
        type: string
      source_database:
        type: string
