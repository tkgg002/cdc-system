  internal_api.ShadowBindingRow:
    properties:
      binding_code:
        type: string
      created_at:
        type: string
      ddl_status:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      last_recon_at:
        type: string
      object_code:
        type: string
      physical_table_fqn:
        type: string
      recon_drift:
        type: integer
      registry_id:
        type: integer
      shadow_schema:
        type: string
      shadow_table:
        type: string
      source_db:
        type: string
      source_object_id:
        type: integer
      source_table:
        type: string
      source_type:
        type: string
      updated_at:
        type: string
      write_mode:
        type: string
    type: object
  internal_api.SourceObjectMappingContext:
    properties:
      bridge_status:
        type: string
      created_at:
        type: string
      ddl_status:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      is_table_created:
        type: boolean
      metadata_status:
        type: string
      notes:
        type: string
      object_code:
        type: string
      physical_table_fqn:
        type: string
      primary_key_field:
        type: string
      primary_key_type:
        type: string
      priority:
        type: string
      profile_status:
        type: string
      recon_drift:
        type: integer
      registry_id:
        type: integer
      shadow_binding_id:
        type: integer
      shadow_schema:
        type: string
      source_db:
        type: string
      source_table:
        type: string
      source_type:
        type: string
      sync_engine:
        type: string
      sync_interval:
        type: string
      sync_status:
        type: string
      target_table:
        type: string
      timestamp_field:
        type: string
