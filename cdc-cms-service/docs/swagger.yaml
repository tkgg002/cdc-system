  internal_api.SourceObjectRow:
    properties:
      bridge_status:
        type: string
      created_at:
        type: string
      ddl_status:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      is_table_created:
        type: boolean
      metadata_status:
        type: string
      notes:
        type: string
      object_code:
        type: string
      physical_table_fqn:
        type: string
      primary_key_field:
        type: string
      primary_key_type:
        type: string
      priority:
        type: string
      profile_status:
        type: string
      provisioning_mode:
        type: string
      provisioning_state:
        type: string
      recon_drift:
        type: integer
      registry_id:
        type: integer
      shadow_binding_id:
        type: integer
      shadow_schema:
        type: string
      source_db:
        type: string
      source_engine_type:
        type: string
      source_table:
        type: string
      source_type:
        type: string
      sync_engine:
        type: string
      sync_interval:
        type: string
      sync_status:
        type: string
      target_table:
        type: string
      timestamp_field:
        type: string
      updated_at:
        type: string
    type: object
  internal_api.SourceObjectStats:
    properties:
      by_priority:
        additionalProperties:
          type: integer
        type: object
      by_source_db:
        additionalProperties:
          type: integer
        type: object
      by_sync_engine:
        additionalProperties:
          type: integer
        type: object
      tables_created:
        type: integer
      total:
        type: integer
