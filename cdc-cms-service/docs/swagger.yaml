  cdc-cms-service_internal_infra_persistence.SourceProvisioningSnapshot:
    properties:
      last_step_error:
        type: string
      provisioning_mode:
        type: string
      provisioning_state:
        type: string
      provisioning_step_log:
        items:
          type: integer
        type: array
      source_id:
        type: integer
      updated_at:
        type: string
