info:
  contact: {}
  description: CMS Service for CDC Integration.
  title: CDC CMS Service API
  version: "1.0"
paths:
  /api/activity-log:
    get:
      description: Returns paginated activity logs enriched with source/shadow scope
        from V2 metadata. Supports source/shadow filters while keeping target_table
        as compatibility fallback.
      parameters:
      - description: Operation filter
        in: query
        name: operation
        type: string
      - description: Status filter
        in: query
        name: status
        type: string
      - description: Triggered by filter
        in: query
        name: triggered_by
        type: string
      - description: Legacy target_table filter
        in: query
        name: target_table
        type: string
      - description: Source database filter
        in: query
        name: source_database
        type: string
      - description: Source table filter
        in: query
        name: source_table
        type: string
      - description: Shadow schema filter
        in: query
        name: shadow_schema
        type: string
      - description: Shadow table filter
        in: query
        name: shadow_table
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List activity logs
      tags:
      - Activity Log
  /api/activity-log/stats:
    get:
      description: Returns 24h aggregated activity stats and recent errors enriched
        with V2 source/shadow scope.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get activity log stats
      tags:
      - Activity Log
  /api/jobs/{id}:
    get:
      description: Returns the cdc_system.cdc_jobs row written by the CommandBus on
        Dispatch and updated by the worker JobMonitor on cdc.evt.X.completed.
      parameters:
      - description: Job UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get async job
      tags:
      - Jobs
  /api/mapping-rules:
    get:
      description: Returns V2 mapping rules, optionally filtered by source object
        or source/shadow scope. Legacy table/source_table params are still accepted
        as fallback.
      parameters:
      - description: Filter by source object ID
        in: query
        name: source_object_id
        type: integer
      - description: Filter by source database
        in: query
        name: source_database
        type: string
      - description: Filter by source object name
        in: query
        name: source_table
        type: string
      - description: Filter by shadow schema
        in: query
        name: shadow_schema
        type: string
      - description: Filter by shadow table
        in: query
        name: shadow_table
        type: string
      - description: Filter by status
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List mapping rules
      tags:
      - Mapping Rules
    post:
      consumes:
      - application/json
      description: Creates a V2 mapping rule in cdc_system.mapping_rule_v2. Supports
        source_object_id or source/shadow scope resolution; legacy source_table is
        accepted as fallback.
      parameters:
      - description: Mapping rule details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/cdc-cms-service_internal_api_dto.MappingRuleCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a mapping rule
      tags:
      - Mapping Rules
  /api/mapping-rules/{id}:
    patch:
      description: Updates the status of a V2 mapping rule.
      responses: {}
      summary: Update mapping rule status
      tags:
      - Mapping Rules
  /api/mapping-rules/reload:
    post:
      description: Publishes a NATS message to trigger workers to reload mapping rules
        from DB.
      produces:
      - application/json
      responses: {}
      summary: Reload mapping rules for workers
      tags:
      - Mapping Rules
  /api/schema-changes/{id}/approve:
    post:
      consumes:
      - application/json
      description: 'Approves a pending field: ALTER TABLE ADD COLUMN, create mapping
        rule, publish config reload'
      parameters:
      - description: Pending field ID
        in: path
        name: id
        required: true
        type: integer
      - description: Approval details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/cdc-cms-service_internal_infra_persistence.ApproveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Approve a schema change
      tags:
      - Schema Changes
  /api/schema-changes/{id}/reject:
    post:
      consumes:
      - application/json
      description: Rejects a pending field with a reason
      parameters:
      - description: Pending field ID
        in: path
        name: id
        required: true
        type: integer
      - description: Rejection reason
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/cdc-cms-service_internal_infra_persistence.RejectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Reject a schema change
      tags:
      - Schema Changes
  /api/schema-changes/history:
    get:
      description: Returns audit log of all schema changes (ALTER TABLE, etc.)
      parameters:
      - description: Filter by table name
        in: query
        name: table
        type: string
      - description: Filter by source database
        in: query
        name: source_db
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get schema change history
      tags:
      - Schema Changes
  /api/schema-changes/pending:
    get:
      consumes:
      - application/json
      description: Returns pending fields detected by Schema Inspector, with pagination
        and filters
      parameters:
      - default: pending
        description: Filter by status
        enum:
        - pending
        - approved
        - rejected
        in: query
        name: status
        type: string
      - description: Filter by source database
        in: query
        name: source_db
        type: string
      - description: Filter by table name
        in: query
        name: table
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List pending schema changes
      tags:
      - Schema Changes
  /api/v1/cms/sources/{id}/provisioning:
    get:
      parameters:
      - description: source_object_registry.id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cdc-cms-service_internal_infra_persistence.SourceProvisioningSnapshot'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Snapshot of provisioning state for one source
      tags:
      - Provisioning
  /api/v1/masters:
    get:
      description: Returns V2 master bindings enriched with source and shadow metadata
        from cdc_system.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List master bindings
      tags:
      - Masters
  /api/v1/masters/{name}/swap:
    post:
      consumes:
      - application/json
      description: Kicks off an atomic master-table swap as a background job. Returns
        202 + JobID; poll GET /api/jobs/:id for terminal status. Refuses with 409
        if another swap for the same master is still in flight.
      parameters:
      - description: Master table name
        in: path
        name: name
        required: true
        type: string
      - description: Swap payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.SwapRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Swap physical master tables (async)
      tags:
      - Masters
  /api/v1/shadow-bindings:
    get:
      description: Returns active and inactive shadow bindings from cdc_system.shadow_binding
        enriched with source-object metadata and latest reconciliation context.
      parameters:
      - description: Filter by source database
        in: query
        name: source_db
        type: string
      - description: Filter by active status
        enum:
        - "true"
        - "false"
        in: query
        name: is_active
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.shadowBindingsListResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List V2 shadow bindings
      tags:
      - Source Objects
  /api/v1/source-objects:
    get:
      description: Returns source objects from cdc_system.source_object_registry enriched
        with active shadow binding, reconciliation status, and transitional registry
        bridge metadata.
      parameters:
      - description: Filter by source database
        in: query
        name: source_db
        type: string
      - description: Filter by active status
        enum:
        - "true"
        - "false"
        in: query
        name: is_active
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.sourceObjectsListResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List V2 source objects
      tags:
      - Source Objects
  /api/v1/source-objects/{id}:
    patch:
      consumes:
      - application/json
      description: 'Updates source-object metadata directly in cdc_system for rows
        that no longer rely on the legacy registry bridge. Supported fields: is_active,
        timestamp_field, notes.'
      parameters:
      - description: Source object ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a V2 source object directly
      tags:
      - Source Objects
  /api/v1/source-objects/{id}/create-default-columns:
    post:
      consumes:
      - application/json
      description: Dispatches create-default-columns using source_object_id and the
        active shadow binding. The worker receives schema-aware payload so post-create
        state can be reflected back into V2 metadata.
      parameters:
      - description: Source object ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create default columns for a V2 source object
      tags:
      - Source Objects
  /api/v1/source-objects/{id}/detect-timestamp-field:
    post:
      consumes:
      - application/json
      description: Dispatches timestamp-field auto-detection using source_object_id
        and the active shadow binding instead of the legacy registry bridge. The worker
        still consumes the existing NATS subject and resolves by target_table fallback.
      parameters:
      - description: Source object ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Re-detect timestamp field for a V2 source object
      tags:
      - Source Objects
  /api/v1/source-objects/{id}/dispatch-status:
    get:
      description: Reads activity-log based dispatch status for direct V2 source-object
        actions such as timestamp re-detection, using source_object_id to resolve
        the current shadow target.
      parameters:
      - description: Source object ID
        in: path
        name: id
        required: true
        type: integer
      - description: Operation filter, e.g. detect-timestamp-field
        in: query
        name: subject
        type: string
      - description: RFC3339 timestamp lower bound
        in: query
        name: since
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get dispatch status for a V2 source-object action
      tags:
      - Source Objects
  /api/v1/source-objects/{id}/scan-fields:
